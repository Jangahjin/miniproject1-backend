spring:
  application:
    name: miniproject1-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pharmaprice}
    username: ${POSTGRES_USER:pharmaprice}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate       # update/create 절대 금지
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상의 값을 덮어써야 한다.
    secret: ${JWT_SECRET:local-dev-only-secret-key-do-not-use-in-production}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14

recommendation:
  weights:
    price: 0.60
    distance: 0.25
    freshness: 0.15
  freshness-half-life-days: 30
  price-window-days: 90
  price-window-fallback-days: 180
  outlier:
    iqr-multiplier: 1.5
    min-samples: 4

logging:
  level:
    org.hibernate: info
  # traceId(TraceIdFilter가 MDC에 심음)를 로그 각 줄에 찍어, 에러 응답의 traceId로
  # 서버 로그를 검색할 수 있게 한다 (docs/ROADMAP.md T-35).
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
